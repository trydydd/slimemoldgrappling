# Backend configuration
backend:
  name: git-gateway
  branch: main
  squash_merges: true

# Editorial workflow (draft/review/publish via PRs)
publish_mode: editorial_workflow

# Media storage
media_folder: "static/images"
public_folder: "/images"

# Site metadata - use Netlify URL for CMS access
site_url: https://slimemoldgrappling.netlify.app
display_url: https://slimemoldgrappling.netlify.app

# Collections
collections:
  # Blog posts
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Weight", name: "weight", widget: "number", value_type: "int", required: false, hint: "Display order (lower numbers appear first)"}
      - {label: "Hidden", name: "hidden", widget: "boolean", required: false, default: false}
      - {label: "Always Open", name: "alwaysopen", widget: "boolean", required: false, default: false}
      - {label: "Body", name: "body", widget: "markdown"}

  # Side Control Games
  - name: "side_control_games"
    label: "Side Control Games"
    folder: "content/games/side_control"
    create: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    fields:
      - {label: "Archetype", name: "archetype", widget: "hidden", default: "game"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Tags", name: "tags", widget: "list", required: false, hint: "e.g., 'side control', 'control progression'"}
      - {label: "Weight", name: "weight", widget: "number", value_type: "int", default: 0, hint: "Display order (1=first, higher=later)"}
      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "Use this structure:\n\n**Top Player**:\n  * **Position**: \n  * **Objective**: \n  * **Constraints**: \n  * **Win Condition**: \n\n**Bottom Player**:\n  * **Position**: \n  * **Objective**: \n  * **Constraints**: \n  * **Win Condition**: "
        default: |
          **Top Player**:
            * **Position**: 
            * **Objective**: 
            * **Constraints**: 
            * **Win Condition**: 

          **Bottom Player**:
            * **Position**: 
            * **Objective**: 
            * **Constraints**: 
            * **Win Condition**: 

  # Mount Games
  - name: "mount_games"
    label: "Mount Games"
    folder: "content/games/mount"
    create: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    fields:
      - {label: "Archetype", name: "archetype", widget: "hidden", default: "game"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Tags", name: "tags", widget: "list", required: false, hint: "Follow game structure"}
      - {label: "Weight", name: "weight", widget: "number", value_type: "int", default: 0}
      - {label: "Body", name: "body", widget: "markdown", hint: "Follow game structure: Top Player and Bottom Player sections"}

  # Back Control Games
  - name: "back_games"
    label: "Back Control Games"
    folder: "content/games/back"
    create: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    fields:
      - {label: "Archetype", name: "archetype", widget: "hidden", default: "game"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Weight", name: "weight", widget: "number", value_type: "int", default: 0}
      - {label: "Body", name: "body", widget: "markdown", hint: "Follow game structure: Top Player and Bottom Player sections"}

  # Guard Games
  - name: "guard_games"
    label: "Guard Games"
    folder: "content/games/guard_games"
    create: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    fields:
      - {label: "Archetype", name: "archetype", widget: "hidden", default: "game"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Weight", name: "weight", widget: "number", value_type: "int", default: 0}
      - {label: "Body", name: "body", widget: "markdown", hint: "Follow game structure: Top Player and Bottom Player sections"}

  # North South Games
  - name: "north_south_games"
    label: "North South Games"
    folder: "content/games/north_south"
    create: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    fields:
      - {label: "Archetype", name: "archetype", widget: "hidden", default: "game"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Weight", name: "weight", widget: "number", value_type: "int", default: 0}
      - {label: "Body", name: "body", widget: "markdown", hint: "Follow game structure: Top Player and Bottom Player sections"}

  # Knee on Belly Games
  - name: "knee_on_belly_games"
    label: "Knee on Belly Games"
    folder: "content/games/knee_on_belly"
    create: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    fields:
      - {label: "Archetype", name: "archetype", widget: "hidden", default: "game"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Weight", name: "weight", widget: "number", value_type: "int", default: 0}
      - {label: "Body", name: "body", widget: "markdown", hint: "Follow game structure: Top Player and Bottom Player sections"}

  # Resources
  - name: "resources"
    label: "Resources"
    folder: "content/resources"
    create: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Weight", name: "weight", widget: "number", value_type: "int", required: false}
      - {label: "Always Open", name: "alwaysopen", widget: "boolean", required: false, default: false}
      - {label: "Body", name: "body", widget: "markdown"}

  # Training Logs
  - name: "training_logs"
    label: "Training Logs"
    folder: "content/training_log"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: md
    format: yaml-frontmatter
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Weight", name: "weight", widget: "number", value_type: "int", required: false}
      - {label: "Body", name: "body", widget: "markdown"}

<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <!-- Include the script that builds the page and powers Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    
    <!-- Custom shortcode editor components -->
    <script>
      // Register custom editor component for expand shortcode
      CMS.registerEditorComponent({
        id: "expand",
        label: "Expandable Section",
        
        fields: [
          {
            name: "title",
            label: "Section Title",
            widget: "string",
            default: "**Game 1: Title**"
          },
          {
            name: "open",
            label: "Default Open",
            widget: "boolean",
            default: true
          },
          {
            name: "content",
            label: "Content",
            widget: "markdown"
          }
        ],
        
        pattern: /^{{% expand open=(true|false) title="([^"]+)" %}}([\s\S]*?){{% \/expand %}}/,
        
        fromBlock: function(match) {
          return {
            open: match[1] === "true",
            title: match[2],
            content: match[3].trim()
          };
        },
        
        toBlock: function(obj) {
          return `{{% expand open=${obj.open} title="${obj.title}" %}}\n${obj.content}\n{{% /expand %}}`;
        },
        
        toPreview: function(obj) {
          return `<details ${obj.open ? 'open' : ''}>
            <summary>${obj.title}</summary>
            <div>${obj.content}</div>
          </details>`;
        }
      });

      // Register component for include_page_body shortcode
      CMS.registerEditorComponent({
        id: "include_game",
        label: "Include Game",
        
        fields: [
          {
            name: "path",
            label: "Game Path",
            widget: "string",
            hint: "e.g., games/back/maintain_connection"
          }
        ],
        
        pattern: /{{% include_page_body "([^"]+)" %}}/,
        
        fromBlock: function(match) {
          return { path: match[1] };
        },
        
        toBlock: function(obj) {
          return `{{% include_page_body "${obj.path}" %}}`;
        },
        
        toPreview: function(obj) {
          return `<div style="border: 2px dashed #ccc; padding: 1em; margin: 0.5em 0;">
            📄 <strong>Including game:</strong> <code>${obj.path}</code>
          </div>`;
        }
      });

      // Register component for newsletter shortcode
      CMS.registerEditorComponent({
        id: "newsletter",
        label: "Newsletter Signup",
        
        fields: [],
        
        pattern: /{{< newsletter >}}/,
        
        fromBlock: function(match) {
          return {};
        },
        
        toBlock: function(obj) {
          return `{{< newsletter >}}`;
        },
        
        toPreview: function(obj) {
          return `<div style="border: 2px solid #7dc903; padding: 1em; margin: 0.5em 0; background: #f0f0f0;">
            📧 <strong>Newsletter Signup Form</strong> (MailerLite)
          </div>`;
        }
      });
    </script>
  </body>
</html>
